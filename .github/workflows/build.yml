name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if a zip was uploaded
        run: |
          if ls *.zip >/dev/null 2>&1; then unzip -o *.zip -d . ; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Inject CurseForge key
        env:
          CF_KEY: ${{ secrets.CF_API_KEY }}
        run: sed -i "s#__CF_KEY__#${CF_KEY}#" www/config.js
      - name: Add Android platform
        run: |
          [ -d android ] || npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ModManager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
